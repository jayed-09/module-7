<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Profile Manager</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;

            margin: 0;
            padding: 30px;
        }


        .container {
            max-width: 800px;
            margin: auto;
        }


        .box {
            background: white;
            padding: 25px;
            margin-bottom: 25px;

            border-radius: 10px;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.1);
        }


        h1,
        h2 {
            text-align: center;
        }


        .form-group {
            margin-bottom: 15px;
        }


        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }


        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }


        button {
            padding: 10px 15px;

            border: none;
            border-radius: 5px;

            background: #007bff;
            color: white;

            cursor: pointer;
            margin-top: 5px;
        }


        .delete-btn {
            background: red;
        }


        .student-card {
            border: 1px solid #ddd;
            padding: 15px;

            margin-top: 15px;

            border-radius: 8px;
        }


        .error {
            color: red;
            margin-top: 10px;
        }


        .success {
            color: green;
            margin-top: 10px;
        }


        #apiData {
            background: #eef6ff;
            padding: 15px;
            border-radius: 8px;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>Student Profile Manager</h1>


        <!-- Student Form -->

        <div class="box">

            <h2>Add Student</h2>


            <form id="studentForm">


                <div class="form-group">

                    <label for="studentId">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Enter student ID"
                    >

                </div>


                <div class="form-group">

                    <label for="studentName">
                        Name
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter name"
                    >

                </div>


                <div class="form-group">

                    <label for="studentEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="studentEmail"
                        placeholder="Enter email"
                    >

                </div>


                <button type="submit">
                    Add Student
                </button>


                <div
                    id="formMessage">
                </div>

            </form>

        </div>


        <!-- Student List -->

        <div class="box">

            <h2>Saved Students</h2>

            <div id="studentList"></div>

        </div>


        <!-- Session Storage -->

        <div class="box">

            <h2>Session Information</h2>

            <p id="sessionMessage"></p>

        </div>


        <!-- API -->

        <div class="box">

            <h2>Additional API Data</h2>

            <button id="apiButton">
                Load API Data
            </button>

            <div id="apiData">
                No API data loaded yet.
            </div>

        </div>

    </div>


    <script>

        // ==========================
        // DOM SELECTION
        // ==========================

        const form =
            document.getElementById("studentForm");

        const studentList =
            document.getElementById("studentList");

        const formMessage =
            document.getElementById("formMessage");

        const sessionMessage =
            document.getElementById("sessionMessage");

        const apiButton =
            document.getElementById("apiButton");

        const apiData =
            document.getElementById("apiData");


        // ==========================
        // LOCAL STORAGE
        // ==========================

        let students =
            JSON.parse(
                localStorage.getItem("students")
            ) || [];


        // ==========================
        // SESSION STORAGE
        // ==========================

        let visitCount =
            Number(
                sessionStorage.getItem("visitCount")
            ) || 0;


        visitCount++;

        sessionStorage.setItem(
            "visitCount",
            visitCount
        );


        sessionMessage.textContent =
            "This session visit count: " +
            visitCount;


        // ==========================
        // DISPLAY STUDENTS
        // ==========================

        function displayStudents() {

            studentList.innerHTML = "";


            if (students.length === 0) {

                studentList.textContent =
                    "No students saved.";

                return;

            }


            students.forEach(function(student, index) {

                const card =
                    document.createElement("div");

                card.classList.add("student-card");


                const title =
                    document.createElement("h3");

                title.textContent =
                    student.name;


                const id =
                    document.createElement("p");

                id.textContent =
                    "ID: " + student.id;


                const email =
                    document.createElement("p");

                email.textContent =
                    "Email: " + student.email;


                const deleteButton =
                    document.createElement("button");

                deleteButton.textContent =
                    "Delete";

                deleteButton.classList.add(
                    "delete-btn"
                );


                deleteButton.addEventListener(
                    "click",
                    function() {

                        students.splice(index, 1);


                        localStorage.setItem(
                            "students",
                            JSON.stringify(students)
                        );


                        displayStudents();

                    }
                );


                card.appendChild(title);
                card.appendChild(id);
                card.appendChild(email);
                card.appendChild(deleteButton);


                studentList.appendChild(card);

            });

        }


        // ==========================
        // FORM SUBMIT
        // ==========================

        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const id =
                    document.getElementById(
                        "studentId"
                    ).value.trim();


                const name =
                    document.getElementById(
                        "studentName"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "studentEmail"
                    ).value.trim();


                formMessage.textContent = "";


                // Validation

                if (
                    id === "" ||
                    name === "" ||
                    email === ""
                ) {

                    formMessage.textContent =
                        "Please fill in all fields.";

                    formMessage.className =
                        "error";

                    return;

                }


                // Create object

                const student = {

                    id: id,
                    name: name,
                    email: email

                };


                // Add to array

                students.push(student);


                // Convert object/array to JSON

                localStorage.setItem(
                    "students",
                    JSON.stringify(students)
                );


                formMessage.textContent =
                    "Student added successfully.";

                formMessage.className =
                    "success";


                form.reset();


                displayStudents();

            }
        );


        // ==========================
        // FETCH API DATA
        // ==========================

        apiButton.addEventListener(
            "click",
            async function() {

                apiData.textContent =
                    "Loading...";


                try {

                    const response =
                        await fetch(
                            "https://jsonplaceholder.typicode.com/users/1"
                        );


                    if (!response.ok) {

                        throw new Error(
                            "Failed to load API data."
                        );

                    }


                    const data =
                        await response.json();


                    apiData.innerHTML =

                        "<strong>Name:</strong> " +
                        data.name +
                        "<br><br>" +

                        "<strong>Username:</strong> " +
                        data.username +
                        "<br><br>" +

                        "<strong>Email:</strong> " +
                        data.email +
                        "<br><br>" +

                        "<strong>Company:</strong> " +
                        data.company.name;

                } catch (error) {

                    apiData.textContent =
                        "Error: " +
                        error.message;

                }

            }
        );


        // Display existing saved students
        displayStudents();

    </script>

</body>

</html>
