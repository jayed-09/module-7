<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Weather Dashboard</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            background: #e8f4ff;

            margin: 0;
            padding: 30px;
        }


        .container {
            max-width: 500px;
            margin: auto;
        }


        h1 {
            text-align: center;
        }


        .search-box {
            display: flex;
            gap: 10px;
        }


        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
        }


        button {
            padding: 12px 20px;
            background: #007bff;
            color: white;

            border: none;
            cursor: pointer;
        }


        .weather-card {
            margin-top: 25px;

            background: white;
            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.1);

            text-align: center;
        }


        #message {
            text-align: center;
            margin-top: 20px;
        }


        .temperature {
            font-size: 50px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>Weather Dashboard</h1>


        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city"
                value="Chattogram"
            >

            <button id="searchButton">
                Search
            </button>

        </div>


        <div id="message"></div>


        <div
            id="weatherCard"
            class="weather-card"
            style="display: none;"
        >

            <h2 id="cityName"></h2>

            <div
                id="temperature"
                class="temperature">
            </div>

            <p id="wind"></p>

            <p id="weatherStatus"></p>

        </div>

    </div>


    <script>

        const cityInput =
            document.getElementById("cityInput");

        const searchButton =
            document.getElementById("searchButton");

        const message =
            document.getElementById("message");

        const weatherCard =
            document.getElementById("weatherCard");


        searchButton.addEventListener(
            "click",
            getWeather
        );


        cityInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    getWeather();
                }

            }
        );


        async function getWeather() {

            const city =
                cityInput.value.trim();


            if (city === "") {

                message.textContent =
                    "Please enter a city name.";

                return;

            }


            message.textContent =
                "Loading...";

            weatherCard.style.display = "none";


            try {

                // Step 1: Find city coordinates

                const geoResponse =
                    await fetch(
                        "https://geocoding-api.open-meteo.com/v1/search" +
                        "?name=" +
                        encodeURIComponent(city) +
                        "&count=1&language=en&format=json"
                    );


                if (!geoResponse.ok) {
                    throw new Error(
                        "Could not find the city."
                    );
                }


                const geoData =
                    await geoResponse.json();


                if (
                    !geoData.results ||
                    geoData.results.length === 0
                ) {

                    throw new Error(
                        "City not found."
                    );

                }


                const location =
                    geoData.results[0];


                // Step 2: Get weather

                const weatherResponse =
                    await fetch(
                        "https://api.open-meteo.com/v1/forecast" +
                        "?latitude=" +
                        location.latitude +
                        "&longitude=" +
                        location.longitude +
                        "&current=" +
                        "temperature_2m," +
                        "wind_speed_10m," +
                        "weather_code" +
                        "&timezone=auto"
                    );


                if (!weatherResponse.ok) {
                    throw new Error(
                        "Could not fetch weather."
                    );
                }


                const weatherData =
                    await weatherResponse.json();


                const current =
                    weatherData.current;


                // Display results

                document.getElementById(
                    "cityName"
                ).textContent =
                    location.name +
                    ", " +
                    location.country;


                document.getElementById(
                    "temperature"
                ).textContent =
                    current.temperature_2m +
                    " °C";


                document.getElementById(
                    "wind"
                ).textContent =
                    "Wind Speed: " +
                    current.wind_speed_10m +
                    " km/h";


                document.getElementById(
                    "weatherStatus"
                ).textContent =
                    getWeatherText(
                        current.weather_code
                    );


                message.textContent = "";

                weatherCard.style.display =
                    "block";

            } catch (error) {

                message.textContent =
                    "Error: " + error.message;

            }

        }


        function getWeatherText(code) {

            if (code === 0) {
                return "Clear sky";
            }

            if (code === 1 ||
                code === 2 ||
                code === 3) {
                return "Partly cloudy";
            }

            if (
                code === 45 ||
                code === 48
            ) {
                return "Foggy";
            }

            if (
                code >= 51 &&
                code <= 67
            ) {
                return "Rain";
            }

            if (
                code >= 71 &&
                code <= 77
            ) {
                return "Snow";
            }

            if (
                code >= 80 &&
                code <= 82
            ) {
                return "Rain showers";
            }

            if (
                code >= 95
            ) {
                return "Thunderstorm";
            }

            return "Unknown weather";

        }


        getWeather();

    </script>

</body>
</html>
